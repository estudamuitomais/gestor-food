name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax checks
        run: npm run check

      - name: Test suite
        run: npm test

  container:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag gestor-food-ci .

      - name: Start container
        run: docker run --detach --name gestor-food-ci --publish 3000:3000 gestor-food-ci

      - name: Inspect container
        run: |
          sleep 2
          docker ps --all
          docker logs gestor-food-ci

      - name: Check health endpoint
        run: curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:3000/healthz

      - name: Check readiness endpoint
        run: curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:3000/readyz

      - name: Confirm external integration remains locked in CI
        run: curl --fail http://127.0.0.1:3000/api/ifood/config | grep -q '"enabled":false'

      - name: Stop container
        if: always()
        run: docker rm --force gestor-food-ci
