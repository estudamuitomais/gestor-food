<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Gestor Food — Logo Premium</title>
  <desc id="desc">Monograma GF sobre prato com gráfico de crescimento</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a31"/>
      <stop offset="0.55" stop-color="#21486c"/>
      <stop offset="1" stop-color="#0e8a91"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a4c"/>
