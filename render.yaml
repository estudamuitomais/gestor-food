services:
  - type: web
    name: gestor-food-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: IFOOD_INTEGRATION_ENABLED
        value: "false"
      - key: IFOOD_CLIENT_ID
        sync: false
      - key: IFOOD_CLIENT_SECRET
        sync: false
